name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari jam 00:00 UTC (07:00 WIB)
  workflow_dispatch: # Memunculkan tombol manual "Run workflow" di GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync upstream changes
        run: |
          gh repo sync spyd3rking/tepg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
